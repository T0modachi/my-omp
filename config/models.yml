# Model roles delivered to OMP as a global overlay via PI_CONFIG_FILES.
# OMP owns its own ~/.omp/agent/config.yml (runtime-writable); this overlay
# only sets modelRoles + cycleOrder and wins over that file
# (precedence: runtime > overlay > project > global > default).
# ============================================================
# Alternatives (commented out — uncomment ONE and comment/replace
# the active `modelRoles` + `cycleOrder` block above).
# Prices are per 1M tokens: Input / Output / Cached Read / Cached Write.
# Slug format (opencode-go/<model>%) matches the active config.
# Source: https://opencode.ai/docs/go (pricing as of 2026-11-07).
# ============================================================

# --- Active: Best results/price ratio (balanced) ---
# default  Kimi K2.7 Code      $0.95 / $4.00 / $0.19          code-specific workhorse
# smol     MiMo-V2.6-Flash     $0.14 / $0.28 / $0.0028        cheapest capable light turns
# slow     Qwen3.7 Plus        $0.40 / $1.60 / $0.04 / $0.50  deep reasoning without paying Max
modelRoles:
  default: opencode-go/kimi-k2.7-code%
  smol: opencode-go/mimo-v2.6-flash%
  slow: opencode-go/qwen3.7-plus%
cycleOrder:
  - default
  - smol
  - slow

